<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트 AI 식물 MBTI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Pretendard', sans-serif; background-color: #0c0a09; }
        
        .glass-card {
            background: rgba(20, 24, 22, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(52, 211, 153, 0.25);
        }
        .glow-effect {
            box-shadow: 0 0 35px -5px rgba(16, 185, 129, 0.3);
        }
        .image-start-glow {
            animation: imagePulse 2s infinite;
        }
        @keyframes imagePulse {
            0% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.8); }
            70% { box-shadow: 0 0 0 16px rgba(217, 119, 6, 0); }
            100% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center sm:py-6 select-none overflow-hidden">

    <!-- 모바일 퍼스트 래퍼 -->
    <main class="w-full sm:w-[400px] h-screen sm:h-[844px] bg-stone-900 sm:rounded-[3rem] shadow-2xl overflow-hidden border border-emerald-500/20 flex flex-col justify-between relative">
        
        <!-- 상단 상태바 -->
        <header class="absolute top-0 left-0 right-0 bg-gradient-to-b from-stone-950/90 to-transparent px-6 py-4 flex items-center justify-between z-30 pointer-events-none">
            <div class="flex items-center space-x-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-xs font-bold text-emerald-400 tracking-wider">PLANT MBTI</span>
            </div>
            <div class="text-xs text-stone-300 font-medium tracking-tight">Botanic Edition</div>
        </header>

        <!-- 컨텐츠 영역 -->
        <div id="app-container" class="flex-1 overflow-hidden relative flex flex-col bg-stone-950 text-stone-100">
            
            <!-- ==========================================
                 1. 커버 화면 (Start) - 기존 형태 유지
                 ========================================== -->
            <section id="screen-start" class="screen-view flex flex-col h-full relative bg-cover bg-center" style="background-image: url('greenhouse.webp');">
                <div class="absolute inset-0 z-15 pointer-events-none">
                    <button onclick="startTest()" class="absolute left-[50.4%] top-[73.2%] -translate-x-1/2 -translate-y-1/2 w-[19%] aspect-square rounded-full cursor-pointer pointer-events-auto z-20 image-start-glow active:scale-95 transition duration-150 flex items-center justify-center bg-amber-600/25 hover:bg-amber-500/40 border border-amber-300/70 shadow-xl" aria-label="시작하기">
                    </button>
                </div>
            </section>

            <!-- ==========================================
                 2. 질문 화면 (Question) - 가독성 및 터치 영역 대폭 강화
                 ========================================== -->
            <section id="screen-question" class="screen-view hidden flex-col justify-between h-full p-6 pt-16 bg-stone-950">
                <div class="text-center pt-2 space-y-1.5">
                    <h2 id="question-number-badge" class="text-3xl sm:text-4xl font-black text-emerald-400 tracking-wider">Q1</h2>
                    <span id="progress-text" class="text-sm font-semibold text-stone-300">1 / 8</span>
                </div>

                <div class="my-auto space-y-8 py-2">
                    <div class="text-center space-y-3 px-2">
                        <h3 id="question-text" class="text-lg sm:text-xl font-bold text-stone-100 leading-relaxed break-keep">
                            질문이 여기에 표시됩니다.
                        </h3>
                    </div>

                    <div class="space-y-4">
                        <button onclick="selectOption('A')" id="btn-a" class="w-full text-left glass-card hover:bg-emerald-950/50 hover:border-emerald-500/80 border border-stone-800 text-stone-100 font-semibold p-5 rounded-2xl text-base sm:text-lg transition duration-200 leading-relaxed shadow-md active:scale-[0.98]">
                            선택지 A
                        </button>
                        <button onclick="selectOption('B')" id="btn-b" class="w-full text-left glass-card hover:bg-emerald-950/50 hover:border-emerald-500/80 border border-stone-800 text-stone-100 font-semibold p-5 rounded-2xl text-base sm:text-lg transition duration-200 leading-relaxed shadow-md active:scale-[0.98]">
                            선택지 B
                        </button>
                    </div>
                </div>

                <div class="pb-6">
                    <div class="w-full bg-stone-900 h-2.5 rounded-full overflow-hidden border border-stone-800">
                        <div id="progress-bar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full w-[12.5%] transition-all duration-300 rounded-full"></div>
                    </div>
                </div>
            </section>

            <!-- ==========================================
                 3. 로딩 화면 (Loading)
                 ========================================== -->
            <section id="screen-loading" class="screen-view hidden flex-col items-center justify-center h-full p-6 text-center space-y-5 bg-stone-950">
                <div class="relative flex items-center justify-center">
                    <div class="w-16 h-16 border-4 border-stone-800 border-t-emerald-400 rounded-full animate-spin"></div>
                    <span class="absolute text-xl">🌱</span>
                </div>
                <div class="space-y-1">
                    <h3 class="text-white font-bold text-lg tracking-tight">식물 성향 분석 중</h3>
                    <p class="text-sm text-stone-400">당신과 꼭 닮은 소울메이트 식물을 찾는 중입니다...</p>
                </div>
            </section>

            <!-- ==========================================
                 4. 결과 화면 (Result)
                 ========================================== -->
            <section id="screen-result" class="screen-view hidden flex-col justify-between h-full p-5 pt-12 bg-stone-950 overflow-y-auto">
                <div class="space-y-4">
                    <!-- 1. 영문 성향 -->
                    <div id="result-mbti" class="text-center text-3xl sm:text-4xl font-black text-emerald-400 tracking-widest uppercase drop-shadow">
                        ISTP
                    </div>
                    
                    <!-- 2. 성향 설명 (가독성 향상) -->
                    <div class="glass-card p-4 rounded-2xl text-sm sm:text-base text-stone-200 leading-relaxed border border-stone-800 space-y-2 text-left shadow-lg">
                        <p id="result-desc-1" class="break-keep">• 설명 1</p>
                        <p id="result-desc-2" class="break-keep">• 설명 2</p>
                        <p id="result-desc-3" class="break-keep">• 설명 3</p>
                    </div>

                    <!-- 3. 추천식물 사진 및 이름 -->
                    <div class="text-center space-y-2 pt-1">
                        <div class="text-xs font-bold text-emerald-400 tracking-wider uppercase">🌱 추천 반려식물</div>
                        <div class="flex justify-center">
                            <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl overflow-hidden border-2 border-emerald-500/40 shadow-xl relative bg-stone-900">
                                <img id="result-img" src="" alt="식물 이미지" class="w-full h-full object-cover">
                            </div>
                        </div>
                        <h2 id="result-name" class="text-lg sm:text-xl font-black text-white tracking-tight pt-1">스투키</h2>
                    </div>
                </div>

                <!-- 하단 버튼 영역 -->
                <div class="space-y-2.5 pt-4 pb-2">
                    <a href="link_MBTI.html" class="block w-full text-center bg-stone-800 hover:bg-stone-700 text-emerald-400 font-bold py-3.5 rounded-xl text-sm transition border border-emerald-500/30 shadow-md">
                        🔍 식물 자세히 알아보기
                    </a>
                    <div class="flex gap-3">
                        <!-- 다시시작 버튼 -->
                        <button onclick="restartTest()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold py-3.5 rounded-xl shadow-md text-sm sm:text-base transition duration-200">
                            다시시작
                        </button>
                        <!-- 끝내기 버튼 -->
                        <button onclick="exitApp()" class="flex-1 glass-card hover:bg-stone-900 active:scale-95 text-stone-300 hover:text-white font-semibold py-3.5 rounded-xl text-sm sm:text-base transition border border-stone-800 shadow-md">
                            끝내기
                        </button>
                    </div>
                </div>
            </section>

        </div>

        <!-- 하단 홈바 인디케이터 -->
        <footer class="bg-stone-950/90 py-3 flex justify-center items-center border-t border-stone-800/60 z-30">
            <div class="w-32 h-1 bg-stone-700/60 rounded-full"></div>
        </footer>

    </main>

    <script>
        const questions = [
            { q: "내 반려식물을 둘 장소와 나의 평소 소통 스타일은?", a: { text: "거실 창가나 베란다 등 누구나 지나다니며 잘 볼 수 있는 곳", type: "E" }, b: { text: "나만의 아늑한 방 한구석, 조용히 나만 바라볼 수 있는 곳", type: "I" } },
            { q: "식물을 키우며 커뮤니티나 SNS에 소통할 때 나는?", a: { text: "내가 키우는 식물 자랑도 하고 다른 사람들과 활발히 교류한다", type: "E" }, b: { text: "랜선으로 다른 사람들의 식물 사진을 조용히 구경하며 힐링한다", type: "I" } },
            { q: "새로운 반려식물을 입양할 때 가장 먼저 보는 포인트는?", a: { text: "튼튼한 줄기, 선명한 초록 잎 등 눈에 보이는 건강함", type: "S" }, b: { text: "잎의 독특한 무늬나 앞으로 어떻게 자라날지 상상하게 되는 매력", type: "N" } },
            { q: "식물 영양제나 물을 줄 때 나의 스타일은?", a: { text: "설명서에 적힌 정량과 정해진 주기를 칼같이 지킨다", type: "S" }, b: { text: "식물의 컨디션과 그날그날의 분위기를 보고 직관적으로 챙긴다", type: "N" } },
            { q: "식물 잎이 노랗게 변해 떨어졌을 때 나의 첫 반응은?", a: { text: "'광량 부족인가, 과습인가?' 원인을 냉정하게 분석한다", type: "T" }, b: { text: "'내가 뭘 잘못했지...' 너무 마음이 아프고 속상하다", type: "F" } },
            { q: "친구에게 식물을 선물하려 할 때 고르는 기준은?", a: { text: "초보자도 절대 안 죽이는 생명력 최강의 공기정화 식물", type: "T" }, b: { text: "친구의 감성과 취향을 저격할 아기자기하고 예쁜 꽃 화분", type: "F" } },
            { q: "식물 물주기 스케줄을 관리하는 나만의 방식은?", a: { text: "스마트폰 캘린더나 메모장에 주기를 철저히 기록해 둔다", type: "J" }, b: { text: "흙을 손가락으로 꾹 찔러보고 건조할 때 자유롭게 준다", type: "P" } },
            { q: "분갈이를 하거나 화분을 꾸밀 때 나는?", a: { text: "화분 크기, 흙 배합 비율, 자갈 배치까지 완벽하게 계획한다", type: "J" }, b: { text: "그날 기분에 맞는 화분과 소품을 즉흥적으로 골라 감성 있게 배치한다", type: "P" } }
        ];

        const plantDB = {
            "ISTJ": { name: "라울", img: "https://images.unsplash.com/photo-1509587584294-0f4b74cdc10d?w=500&auto=format&fit=crop&q=60", desc: ["단정하고 튼튼하게 자라며 규칙적인 루틴 속에서 안정감을 찾는 성향입니다.", "바르게 뻗은 곧은 줄기와 단단한 잎을 가진 식물을 선호합니다.", "매뉴얼과 정해진 물주기 주기를 철저히 지키며 체계적으로 관리합니다."] },
            "ISTP": { name: "스투키", img: "https://images.unsplash.com/photo-1614594975525-e45190c55d0b?w=500&auto=format&fit=crop&q=60", desc: ["무심한 듯 혼자서도 쿨하게 살아남는 시크한 마이웨이 성향입니다.", "손이 많이 가지 않고 독립적으로 잘 버티는 미니멀한 식물을 선호합니다.", "필요할 때만 최소한의 터치로 무심하게 돌봐주는 쿨한 방식을 고수합니다."] },
            "ISFJ": { name: "스킨답서스", img: "https://images.unsplash.com/photo-1634515280549-d07963df6fcd?w=500&auto=format&fit=crop&q=60", desc: ["조용히 묵묵히 주변을 정화해 주는 따뜻하고 다정한 수호자 성향입니다.", "은은한 초록빛으로 실내를 편안하게 채워주는 순한 식물을 선호합니다.", "흙의 마름을 수시로 살피며 정성스럽고 세심하게 물을 챙겨줍니다."] },
            "ISFP": { name: "몬스테라", img: "https://images.unsplash.com/photo-1614594975525-e45190c55d0b?w=500&auto=format&fit=crop&q=60", desc: ["자연스러운 매력으로 공간을 채우는 감성적인 아티스트 성향입니다.", "독특한 잎 모양이나 감각적인 수형을 가진 인테리어 식물을 선호합니다.", "그날의 기분과 직관에 따라 감성적인 배치를 하며 자유롭게 교감합니다."] },
            "INTJ": { name: "파키라", img: "https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=500&auto=format&fit=crop&q=60", desc: ["철저한 계획 속에 웅장하고 멋지게 키워내는 전략가 성향입니다.", "곧게 자라며 공간에 품격을 더해주는 구조적인 수형의 나무를 선호합니다.", "장기적인 성장을 목표로 최적의 환경과 영양을 논리적으로 계산합니다."] },
            "INTP": { name: "틸란드시아", img: "https://images.unsplash.com/photo-1520302212323-c5c0c07d7bbb?w=500&auto=format&fit=crop&q=60", desc: ["흙 없이도 자신만의 독특한 세계에서 자유롭게 살아가는 영혼 성향입니다.", "일반적인 화분 배치가 아닌 색다른 형태의 에어플랜트를 선호합니다.", "생장의 원리를 흥미롭게 관찰하며 호기심 위주로 여유롭게 돌봅니다."] },
            "INFJ": { name: "아디안텀", img: "https://images.unsplash.com/photo-1512428559087-560fa5ceab42?w=500&auto=format&fit=crop&q=60", desc: ["섬세한 감수성과 깊은 교감으로 마음을 나누는 시인 성향입니다.", "부드럽고 하늘하늘한 잎결을 지녀 세심한 손길이 닿는 식물을 선호합니다.", "식물의 미세한 컨디션 변화까지 진심으로 공감하며 따뜻하게 보살핍니다."] },
            "INFP": { name: "선인장", img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=500&auto=format&fit=crop&q=60", desc: ["내면의 깊은 감성을 품고 조용히 위로를 건네는 몽상가 성향입니다.", "화려하지 않아도 고유의 감성을 간직한 사연 있는 식물을 선호합니다.", "나만의 교감 공간에서 식물과 정서적인 유대감을 깊게 쌓아갑니다."] },
            "ESTJ": { name: "고무나무", img: "https://images.unsplash.com/photo-1545241047-6083a3684587?w=500&auto=format&fit=crop&q=60", desc: ["단단한 리더십과 체계적인 관리로 공간의 중심을 잡는 총괄 관리자 성향입니다.", "잎이 넓고 웅장하여 시선을 확실히 사로잡는 대형 식물을 선호합니다.", "주기적인 잎 청소와 철저한 스케줄로 완벽한 컨디션을 유지시킵니다."] },
            "ESTP": { name: "해바라기", img: "https://images.unsplash.com/photo-1597848212624-a19eb35e2651?w=500&auto=format&fit=crop&q=60", desc: ["언제나 에너지가 넘치고 시선을 사로잡는 유쾌한 분위기 메이커 성향입니다.", "화사하고 눈에 띄는 선명한 색감의 꽃 식물을 선호합니다.", "햇살이 가득한 양지에서 활기차고 즉흥적인 에너지를 주고받습니다."] },
            "ESFJ": { name: "제라늄", img: "https://images.unsplash.com/photo-1526336024174-e58f5cdd8e13?w=500&auto=format&fit=crop&q=60", desc: ["다채로운 매력으로 주변을 환하게 밝혀주는 다정한 도우미 성향입니다.", "풍성하게 피어나는 꽃망울로 모두의 시선을 사로잡는 식물을 선호합니다.", "주변 사람들과 식물 이야기를 나누며 화사하게 가꾸는 것을 즐깁니다."] },
            "ESFP": { name: "베고니아", img: "https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?w=500&auto=format&fit=crop&q=60", desc: ["화려한 컬러와 개성으로 축제를 즐기는 엔터테이너 성향입니다.", "독특한 무늬와 화려한 색감을 뽐내는 트렌디한 식물을 선호합니다.", "밝고 긍정적인 에너지로 거실 한가운데를 화창하게 꾸며줍니다."] },
            "ENFJ": { name: "아레카야자", img: "https://images.unsplash.com/photo-1612363148128-2c40c910342b?w=500&auto=format&fit=crop&q=60", desc: ["모두를 따뜻하게 품어주는 든든한 초록빛 멘토 성향입니다.", "싱그럽고 풍성하게 뻗어 나가는 잎사귀로 실내를 환하게 채우는 식물을 선호합니다.", "주변의 모든 생명이 건강하게 자라도록 아낌없는 애정과 스프레이를 챙겨줍니다."] },
            "ENFP": { name: "바질", img: "https://images.unsplash.com/photo-1618160702438-9b02ab6515c9?w=500&auto=format&fit=crop&q=60", desc: ["상큼한 향기와 반짝이는 아이디어가 넘치는 자유로운 영혼 성향입니다.", "키우는 재미와 수확의 즐거움을 동시에 주는 향긋한 허브를 선호합니다.", "매일 새로운 변화를 기대하며 열정적이고 즉흥적으로 물을 줍니다."] },
            "ENTJ": { name: "여인초", img: "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?w=500&auto=format&fit=crop&q=60", desc: ["웅장한 스케일과 압도적인 존재감으로 공간을 지배하는 카리스마 통솔자 성향입니다.", "시원하게 뻗은 커다란 수형으로 플랜테리어를 완성하는 대형 나무를 선호합니다.", "완벽한 공간 배치를 계획하고 주도적으로 최적의 생장 환경을 통솔합니다."] },
            "ENTP": { name: "박쥐란", img: "https://images.unsplash.com/photo-1536890998372-c9a2d22c365d?w=500&auto=format&fit=crop&q=60", desc: ["독창적인 스타일과 기발한 발상으로 모두의 허를 찌르는 발명가 성향입니다.", "정형화된 화분을 벗어나 벽에 걸거나 독특하게 부착하는 식물을 선호합니다.", "새롭고 실험적인 방식으로 식물을 키우며 남다른 연출을 즐깁니다."] }
        };

        let currentQuestion = 0;
        let userAnswers = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };

        // 시작 버튼 동작 (커버 -> 질문 화면 전환)
        function startTest() {
            currentQuestion = 0;
            userAnswers = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
            
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-start').classList.remove('flex');
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('flex');
            
            const qScreen = document.getElementById('screen-question');
            qScreen.classList.remove('hidden');
            qScreen.classList.add('flex');
            
            showQuestion();
        }

        // 다시시작 버튼 동작 (결과/종료 화면 -> 질문 화면 또는 초기화)
        function restartTest() {
            location.reload();
        }

        function showQuestion() {
            if (currentQuestion >= questions.length) {
                triggerLoading();
                return;
            }
            const q = questions[currentQuestion];
            document.getElementById('question-number-badge').innerText = `Q${currentQuestion + 1}`;
            document.getElementById('progress-text').innerText = `${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('btn-a').innerText = q.a.text;
            document.getElementById('btn-b').innerText = q.b.text;
            
            const progressPercent = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
        }

        function selectOption(choice) {
            const q = questions[currentQuestion];
            const selectedType = choice === 'A' ? q.a.type : q.b.type;
            userAnswers[selectedType]++;
            
            currentQuestion++;
            
            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                triggerLoading();
            }
        }

        function triggerLoading() {
            document.getElementById('screen-question').classList.add('hidden');
            document.getElementById('screen-question').classList.remove('flex');
            document.getElementById('screen-loading').classList.remove('hidden');
            document.getElementById('screen-loading').classList.add('flex');
            
            setTimeout(() => {
                document.getElementById('screen-loading').classList.add('hidden');
                document.getElementById('screen-loading').classList.remove('flex');
                document.getElementById('screen-result').classList.remove('hidden');
                document.getElementById('screen-result').classList.add('flex');
                displayResult();
            }, 1500);
        }

        function calculateResult() {
            const mbti = 
                (userAnswers.E >= userAnswers.I ? 'E' : 'I') +
                (userAnswers.S >= userAnswers.N ? 'S' : 'N') +
                (userAnswers.T >= userAnswers.F ? 'T' : 'F') +
                (userAnswers.J >= userAnswers.P ? 'J' : 'P');
            return mbti;
        }

        function displayResult() {
            const mbti = calculateResult();
            const plant = plantDB[mbti] || plantDB["ISTP"];
            
            document.getElementById('result-mbti').innerText = mbti;
            document.getElementById('result-name').innerText = plant.name;
            
            document.getElementById('result-desc-1').innerText = `• ${plant.desc[0]}`;
            document.getElementById('result-desc-2').innerText = `• ${plant.desc[1]}`;
            document.getElementById('result-desc-3').innerText = `• ${plant.desc[2]}`;
            
            document.getElementById('result-img').src = plant.img;
        }

        // 끝내기 버튼 처리 함수
        function exitApp() {
            window.close();
            
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full p-6 text-center space-y-5 bg-stone-950">
                    <div class="w-20 h-20 bg-emerald-500/10 rounded-full flex items-center justify-center text-3xl border border-emerald-500/20 shadow-inner">🌱</div>
                    <div class="space-y-2">
                        <h3 class="text-white font-bold text-xl tracking-tight">테스트가 종료되었습니다</h3>
                        <p class="text-sm text-stone-400">이용해주셔서 감사합니다. 창을 닫아주세요.</p>
                    </div>
                    <button onclick="location.reload()" class="mt-4 px-8 py-3.5 bg-stone-800 hover:bg-stone-700 text-emerald-400 font-bold rounded-xl text-sm transition border border-emerald-500/30 shadow-md">
                        처음 화면으로 이동
                    </button>
                </div>
            `;
        }
    </script>
</body>
</html>
