<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트 AI 식물 MBTI - 컴팩트 에디션</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Pretendard', sans-serif; background-color: #0c0a09; }
        
        .glass-card {
            background: rgba(20, 24, 22, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(52, 211, 153, 0.2);
        }
        .glow-effect {
            box-shadow: 0 0 30px -5px rgba(16, 185, 129, 0.25);
        }
        /* 이미지 속 START 버튼 위치를 은은하게 감싸는 인터랙티브 펄스 효과 */
        .image-start-glow {
            animation: imagePulse 2s infinite;
        }
        @keyframes imagePulse {
            0% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.8); }
            70% { box-shadow: 0 0 0 14px rgba(217, 119, 6, 0); }
            100% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center sm:py-6 select-none overflow-hidden">

    <!-- 모바일 퍼스트 래퍼 -->
    <main class="w-full sm:w-[380px] h-screen sm:h-[812px] bg-stone-900 sm:rounded-[3rem] shadow-2xl overflow-hidden border border-emerald-500/20 flex flex-col justify-between relative">
        
        <!-- 상단 미니 노치 및 상태바 -->
        <header class="absolute top-0 left-0 right-0 bg-gradient-to-b from-stone-950/80 to-transparent px-6 py-3.5 flex items-center justify-between z-30 pointer-events-none">
            <div class="flex items-center space-x-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-[11px] font-bold text-emerald-400 tracking-wider">PLANT MBTI</span>
            </div>
            <div class="text-[10px] text-stone-400 font-medium tracking-tight">Compact Edition</div>
        </header>

        <!-- 컨텐츠 영역 -->
        <div class="flex-1 overflow-hidden relative flex flex-col bg-stone-950 text-stone-100">
            
            <!-- ==========================================
                 1. 커버 화면 (Start) - 8문항 버전으로 문구 수정
                 ========================================== -->
            <section id="screen-start" class="screen-view flex flex-col h-full relative bg-cover bg-center" style="background-image: url('greenhouse.webp');">
                <!-- 이미지 상단 타이틀 가독성 보완용 그라데이션 -->
                <div class="absolute inset-x-0 top-0 h-1/3 bg-gradient-to-b from-black/60 to-transparent z-10 pointer-events-none"></div>
                
                <!-- 상단 텍스트 (이미지 내 텍스트와 겹치지 않게 위치 조정 필요시 여기에 추가) -->
                <div class="relative z-20 pt-24 px-6 text-center">
                    <h1 class="text-2xl font-extrabold text-white tracking-tight drop-shadow-lg">스마트 AI 식물 MBTI</h1>
                    <p class="text-sm text-stone-200 mt-2 drop-shadow">단 8문항으로 알아보는<br>나만의 소울메이트 식물 찾기</p>
                </div>

                <!-- 이미지 하단 화분 속 START 버튼 위치와 정확히 일치하는 인터랙티브 존 (좌표: 왼쪽 50.4%, 하단 24.5%) -->
                <div class="absolute inset-0 z-15 pointer-events-none">
                    <button onclick="startTest()" class="absolute left-[50.4%] bottom-[24.5%] -translate-x-1/2 w-[19%] aspect-square rounded-full cursor-pointer pointer-events-auto z-20 image-start-glow active:scale-95 transition duration-150 flex items-center justify-center opacity-0 hover:opacity-100 bg-amber-600/30 border border-amber-300/60 shadow-lg" aria-label="시작하기">
                    </button>
                </div>
            </section>

            <!-- ==========================================
                 2. 질문 화면 (Question) - 8문항 로직 적용
                 ========================================== -->
            <section id="screen-question" class="screen-view hidden flex-col justify-between h-full p-6 pt-12 bg-stone-950">
                <div class="flex items-center justify-between">
                    <span id="question-number-badge" class="text-xs font-black text-emerald-400 tracking-wider bg-emerald-950/60 px-3 py-1 rounded-full border border-emerald-500/30">Q1</span>
                    <span id="progress-text" class="text-xs font-semibold text-stone-400">1 / 8</span>
                </div>

                <div class="my-auto space-y-6 py-4">
                    <div class="text-center space-y-3 px-1">
                        <h3 id="question-text" class="text-base sm:text-lg font-bold text-stone-100 leading-relaxed break-keep">
                            질문이 여기에 표시됩니다.
                        </h3>
                    </div>

                    <div class="space-y-3">
                        <button onclick="selectOption('A')" id="btn-a" class="w-full text-left glass-card hover:bg-emerald-950/40 hover:border-emerald-500/60 border border-stone-800/80 text-stone-200 font-medium p-4 rounded-2xl text-sm transition duration-200 leading-relaxed shadow-sm active:scale-[0.98]">
                            선택지 A
                        </button>
                        <button onclick="selectOption('B')" id="btn-b" class="w-full text-left glass-card hover:bg-emerald-950/40 hover:border-emerald-500/60 border border-stone-800/80 text-stone-200 font-medium p-4 rounded-2xl text-sm transition duration-200 leading-relaxed shadow-sm active:scale-[0.98]">
                            선택지 B
                        </button>
                    </div>
                </div>

                <div class="pb-4">
                    <div class="w-full bg-stone-900 h-2 rounded-full overflow-hidden border border-stone-800">
                        <div id="progress-bar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full w-[12.5%] transition-all duration-300 rounded-full"></div>
                    </div>
                </div>
            </section>

            <!-- ==========================================
                 3. 로딩 화면 (Loading)
                 ========================================== -->
            <section id="screen-loading" class="screen-view hidden flex-col items-center justify-center h-full p-6 text-center space-y-4 bg-stone-950">
                <div class="relative flex items-center justify-center">
                    <div class="w-14 h-14 border-3 border-stone-800 border-t-emerald-400 rounded-full animate-spin"></div>
                    <span class="absolute text-base">🌱</span>
                </div>
                <div>
                    <h3 class="text-white font-bold text-base tracking-tight">성향 정밀 분석 중</h3>
                    <p class="text-xs text-stone-400 mt-1">당신만을 위한 식물을 매칭하고 있어요...</p>
                </div>
            </section>

            <!-- ==========================================
                 4. 결과 화면 (Result)
                 ========================================== -->
            <section id="screen-result" class="screen-view hidden flex-col justify-between h-full p-6 pt-12 bg-stone-950 overflow-y-auto">
                <div class="text-center space-y-2">
                    <span id="result-mbti" class="inline-block bg-emerald-950/90 border border-emerald-500/40 text-emerald-300 font-extrabold text-xs px-3.5 py-1 rounded-full tracking-widest uppercase shadow-sm">
                        ISTP
                    </span>
                    <div class="my-2 flex flex-col items-center">
                        <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-2xl overflow-hidden border border-emerald-500/30 shadow-lg relative">
                            <img id="result-img" src="" alt="식물 이미지" class="w-full h-full object-cover">
                        </div>
                    </div>
                    <div>
                        <h2 id="result-name" class="text-lg sm:text-xl font-black text-white tracking-tight">스투키</h2>
                        <p id="result-subtitle" class="text-xs text-emerald-400 font-semibold mt-1 break-keep">"무심한 듯 혼자서도 잘 사는 마이웨이"</p>
                    </div>
                </div>

                <div class="my-3 space-y-3">
                    <div id="result-desc" class="glass-card p-4 rounded-2xl text-xs sm:text-sm text-stone-300 leading-relaxed border border-stone-800/80 break-keep">
                        설명
                    </div>
                    <div class="bg-emerald-950/30 p-4 rounded-2xl text-xs sm:text-sm text-emerald-200 border border-emerald-900/30 break-keep">
                        <span class="font-bold text-emerald-400">💡 키우기 팁:</span> <span id="result-tip">관리 팁</span>
                    </div>
                </div>

                <div class="space-y-2.5 pt-2 pb-2">
                    <button onclick="startTest()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold py-3.5 rounded-xl shadow text-sm transition duration-200">
                        🔄 다시 테스트하기
                    </button>
                    <button onclick="exitProgram()" class="w-full glass-card hover:bg-stone-900 active:scale-95 text-stone-400 hover:text-stone-200 font-medium py-3 rounded-xl text-xs transition border border-stone-800">
                        처음으로 돌아가기
                    </button>
                </div>
            </section>

        </div>

        <!-- 하단 홈바 인디케이터 -->
        <footer class="bg-stone-950/90 py-2.5 flex justify-center items-center border-t border-stone-800/60 z-30">
            <div class="w-32 h-1 bg-stone-700/60 rounded-full"></div>
        </footer>

    </main>

    <script>
        /* 핵심만 추린 8문항 데이터 (E/I, S/N, T/F, J/P 각 2문항) */
        const questions = [
            // E/I
            { q: "주말이 다가오면 당신은 주로 어떤 계획을 세우나요?", a: { text: "친구들과 신나는 약속을 잡는다 (E)", type: "E" }, b: { text: "집에서 밀린 잠을 자거나 혼자만의 시간을 보낸다 (I)", type: "I" } },
            { q: "많은 사람들이 모인 파티나 회식 자리에 가면?", a: { text: "에너지를 얻고 사람들과 어울리는 게 즐겁다 (E)", type: "E" }, b: { text: "시간이 지날수록 기가 빨리고 집에 가고 싶다 (I)", type: "I" } },
            
            // S/N
            { q: "새로운 반려식물을 고를 때, 가장 먼저 눈에 들어오는 기준은?", a: { text: "튼튼하고 깔끔하게 생긴 기본적인 모습 (S)", type: "S" }, b: { text: "모양이나 색이 독특하고 신비로운 느낌 (N)", type: "N" } },
            { q: "식물을 키우는 방법에 대해 배울 때,", a: { text: "정확한 물주기 주기와 온도 등 수치화된 정보가 좋다 (S)", type: "S" }, b: { text: "식물의 전체적인 분위기와 느낌적인 감을 중요시한다 (N)", type: "N" } },
            
            // T/F
            { q: "식물 잎이 시들해진 것을 발견했을 때, 당신의 첫 반응은?", a: { text: "'과습일까? 영양부족일까?' 원인을 먼저 분석한다 (T)", type: "T" }, b: { text: "'아이고 아파라ㅠ' 마음이 아프고 속상해한다 (F)" , type: "F" } },
            { q: "친구에게 식물을 선물하려 할 때 고르는 기준은?", a: { text: "키우기 쉽고 실용적인 공기정화 식물 (T)", type: "T" }, b: { text: "친구의 취향과 감성에 딱 맞는 예쁜 꽃 화분 (F)", type: "F" } },
            
            // J/P
            { q: "식물 물 주는 요일이 다가오면,", a: { text: "달력에 적어두고 루틴대로 정확히 챙긴다 (J)", type: "J" }, b: { text: "흙 상태를 만져보고 말랐을 때 자유롭게 준다 (P)", type: "P" } },
            { q: "반려식물을 위해 화분 받침이나 장식품을 고를 때,", a: { text: "집안 인테리어와 딱 맞는 통일된 디자인을 고른다 (J)", type: "J" }, b: { text: "그때그때 마음에 들고 예뻐 보이는 것을 산다 (P)", type: "P" } }
        ];

        // Plant DB (기존 16종 유지)
        const plantDB = {
            "ISTJ": { name: "라울", img: "https://images.unsplash.com/photo-1509587584294-0f4b74cdc10d?w=500&auto=format&fit=crop&q=60", sub: "투명하고 단정하게 물들어가는 원칙주의 다육이", desc: "햇살을 받으면 핑크빛 끝트머리가 사랑스럽게 물드는 단정하고 튼튼한 다육식물입니다.", careTip: "풍부한 햇볕과 통풍을 유지해주면 물듦이 더욱 예뻐집니다." },
            "ISTP": { name: "스투키", img: "https://images.unsplash.com/photo-1614594975525-e45190c55d0b?w=500&auto=format&fit=crop&q=60", sub: "무심한 듯 혼자서도 쿨하게 살아남는 마이웨이", desc: "물이나
